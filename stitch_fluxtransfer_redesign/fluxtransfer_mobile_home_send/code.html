<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>FluxTransfer - Mobile Home (Empty)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#bbcabf",
                        "inverse-primary": "#006c49",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#005236",
                        "surface": "#0c1512",
                        "text-warm": "#EDEAE2",
                        "secondary-fixed": "#b3eee5",
                        "tertiary-fixed": "#ffdad7",
                        "error": "#ffb4ab",
                        "primary-container": "#10b981",
                        "surface-container": "#18221e",
                        "on-error": "#690005",
                        "surface-container-lowest": "#07100d",
                        "on-secondary-container": "#8ac3bb",
                        "surface-bright": "#323b37",
                        "accent-gold": "#E8A33D",
                        "on-background": "#dae5df",
                        "tertiary": "#ffb3af",
                        "on-secondary-fixed-variant": "#0f4f49",
                        "background": "#0c1512",
                        "surface-container-low": "#141d1a",
                        "on-surface": "#dae5df",
                        "secondary": "#97d2c9",
                        "on-tertiary-fixed-variant": "#842225",
                        "tertiary-container": "#fc7c78",
                        "glass-border": "rgba(255, 255, 255, 0.08)",
                        "surface-container-high": "#222c28",
                        "surface-dim": "#0c1512",
                        "surface-container-highest": "#2d3733",
                        "inverse-surface": "#dae5df",
                        "error-container": "#93000a",
                        "surface-tint": "#4edea3",
                        "primary": "#4edea3",
                        "primary-fixed-dim": "#4edea3",
                        "primary-fixed": "#6ffbbe",
                        "on-primary-fixed": "#002113",
                        "inverse-on-surface": "#29322f",
                        "on-tertiary": "#650911",
                        "outline-variant": "#3c4a42",
                        "outline": "#86948a",
                        "on-secondary": "#003732",
                        "on-tertiary-container": "#711419",
                        "surface-variant": "#2d3733",
                        "on-primary-container": "#00422b",
                        "on-tertiary-fixed": "#410005",
                        "secondary-container": "#13524b",
                        "tertiary-fixed-dim": "#ffb3af",
                        "secondary-fixed-dim": "#97d2c9",
                        "on-secondary-fixed": "#00201d",
                        "on-primary": "#003824",
                        "surface-card": "#16211C"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "base": "4px",
                        "stack-sm": "8px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "stack-lg": "32px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "label-mono": ["JetBrains Mono"],
                        "display-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    fontSize: {
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "display-lg-mobile": ["36px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-mono": ["14px", { lineHeight: "1.4", letterSpacing: "0.05em", fontWeight: "500" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        .gradient-card {
            background: linear-gradient(180deg, rgba(22, 33, 28, 0.8) 0%, rgba(22, 33, 28, 0.4) 100%);
        }
        
        .glass-panel {
            background: rgba(12, 21, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary/30 selection:text-primary">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-sm font-headline-md text-headline-md docked full-width top-0 sticky border-b border-glass-border flex justify-between items-center px-margin-mobile h-14 w-full z-50 pt-safe">
<div class="flex items-center gap-stack-sm text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary tracking-tight text-xl">
            FluxTransfer
        </div>
<button class="text-on-surface-variant hover:brightness-110 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
</header>
<main class="flex-1 flex flex-col px-margin-mobile py-stack-md gap-stack-lg max-w-[672px] mx-auto w-full relative pb-safe">
<!-- Glow Effect -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary/12 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Hero Section -->
<section class="flex flex-col items-center text-center gap-stack-sm pt-stack-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">
                Transfer files.<br/>
<span class="text-primary">Directly. Privately.</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mt-2">
                Fast peer-to-peer file transfers with no cloud upload.
            </p>
</section>
<!-- Segmented Control (Mode Toggle) -->
<div class="flex bg-surface-container-low p-1 rounded-lg border border-glass-border relative">
<!-- Active indicator (Track and knob) -->
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-surface-card rounded-md shadow-sm border border-glass-border transition-transform duration-300 ease-in-out"></div>
<button class="flex-1 py-2 font-label-mono text-label-mono text-primary relative z-10 text-center">
                Send
            </button>
<button class="flex-1 py-2 font-label-mono text-label-mono text-on-surface-variant relative z-10 text-center">
                Receive
            </button>
</div>
<!-- Main Area: Transfer Card -->
<section class="gradient-card border border-glass-border rounded-xl p-stack-lg flex flex-col items-center justify-center gap-stack-lg min-h-[320px] relative overflow-hidden group">
<!-- Dropzone dashed border -->
<div class="absolute inset-4 border-2 border-dashed border-outline-variant rounded-lg transition-colors group-hover:bg-surface-bright/10 pointer-events-none"></div>
<div class="flex flex-col items-center gap-stack-sm relative z-10">
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center text-primary mb-2">
<span class="material-symbols-outlined text-4xl">upload</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Send a file</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[200px]">
                    Tap below or drop files anywhere to start
                </p>
</div>
<div class="flex flex-col w-full gap-stack-sm relative z-10 px-4 mt-4">
<button class="bg-primary-container text-on-primary-container font-label-mono text-label-mono py-3 px-6 rounded-lg hover:brightness-110 active:scale-95 transition-all w-full flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">draft</span>
                    Choose Files
                </button>
<button class="bg-surface-container-high text-on-surface border border-glass-border font-label-mono text-label-mono py-3 px-6 rounded-lg hover:bg-surface-bright active:scale-95 transition-all w-full flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">folder</span>
                    Choose Folder
                </button>
</div>
</section>
<!-- Trust Indicators -->
<section class="flex flex-wrap justify-center gap-stack-md pt-stack-sm">
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-glass-border bg-surface-container-lowest font-label-caps text-label-caps text-on-surface-variant">
<span class="material-symbols-outlined text-sm text-primary">lock</span>
                Encrypted
            </div>
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-glass-border bg-surface-container-lowest font-label-caps text-label-caps text-on-surface-variant">
<span class="material-symbols-outlined text-sm text-primary">bolt</span>
                P2P
            </div>
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-glass-border bg-surface-container-lowest font-label-caps text-label-caps text-on-surface-variant">
<span class="material-symbols-outlined text-sm text-primary">cloud_off</span>
                No cloud
            </div>
</section>
<!-- Recent Transfers (Empty State) -->
<section class="flex flex-col gap-stack-sm mt-stack-md">
<div class="flex justify-between items-center">
<h3 class="font-headline-md text-headline-md text-base text-on-surface">Recent Transfers</h3>
<span class="font-label-caps text-label-caps text-on-surface-variant">History</span>
</div>
<div class="glass-panel border border-glass-border rounded-lg p-stack-md flex flex-col items-center justify-center text-center gap-2 min-h-[120px]">
<span class="material-symbols-outlined text-on-surface-variant opacity-50 text-3xl mb-1">history</span>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">
                     No recent transfers yet.
                 </p>
</div>
</section>
</main>
</body></html>
