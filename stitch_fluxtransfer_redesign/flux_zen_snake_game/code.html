<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flux Zen - Snake Classic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#711419",
                        "tertiary": "#ffb3af",
                        "inverse-primary": "#006c49",
                        "surface-container-high": "#222c28",
                        "surface-tint": "#4edea3",
                        "on-tertiary-fixed": "#410005",
                        "inverse-surface": "#dae5df",
                        "surface-container": "#18221e",
                        "surface-variant": "#2d3733",
                        "primary-fixed": "#6ffbbe",
                        "on-secondary": "#003732",
                        "on-tertiary": "#650911",
                        "inverse-on-surface": "#29322f",
                        "primary": "#4edea3",
                        "surface-bright": "#323b37",
                        "surface-container-highest": "#2d3733",
                        "on-primary-container": "#00422b",
                        "on-tertiary-fixed-variant": "#842225",
                        "tertiary-fixed": "#ffdad7",
                        "on-secondary-fixed": "#00201d",
                        "tertiary-container": "#fc7c78",
                        "on-surface-variant": "#bbcabf",
                        "on-surface": "#dae5df",
                        "surface": "#0c1512",
                        "on-primary-fixed": "#002113",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffb3af",
                        "secondary-fixed-dim": "#97d2c9",
                        "glass-border": "rgba(255, 255, 255, 0.08)",
                        "surface-dim": "#0c1512",
                        "on-secondary-fixed-variant": "#0f4f49",
                        "primary-container": "#10b981",
                        "on-primary": "#003824",
                        "on-background": "#dae5df",
                        "error-container": "#93000a",
                        "surface-container-low": "#141d1a",
                        "background": "#0c1512",
                        "secondary": "#97d2c9",
                        "accent-gold": "#E8A33D",
                        "text-warm": "#EDEAE2",
                        "on-error": "#690005",
                        "outline-variant": "#3c4a42",
                        "outline": "#86948a",
                        "secondary-container": "#13524b",
                        "on-secondary-container": "#8ac3bb",
                        "on-primary-fixed-variant": "#005236",
                        "primary-fixed-dim": "#4edea3",
                        "secondary-fixed": "#b3eee5",
                        "on-error-container": "#ffdad6",
                        "surface-card": "#16211C",
                        "surface-container-lowest": "#07100d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "margin-mobile": "16px",
                        "base": "4px",
                        "stack-md": "16px",
                        "margin-desktop": "40px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter", "sans-serif"],
                        "display-lg": ["Space Grotesk", "sans-serif"],
                        "display-lg-mobile": ["Space Grotesk", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "label-mono": ["JetBrains Mono", "monospace"],
                        "headline-md": ["Space Grotesk", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "label-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 1px;
            background-color: theme('colors.surface-container-highest');
            border: 1px solid theme('colors.glass-border');
            border-radius: theme('borderRadius.lg');
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .game-cell {
            background-color: theme('colors.surface-container-low');
            aspect-ratio: 1 / 1;
        }

        .snake-body {
            background-color: theme('colors.primary');
            box-shadow: 0 0 10px theme('colors.primary');
            border-radius: 2px;
        }
        
        .snake-head {
            background-color: theme('colors.primary-fixed');
            box-shadow: 0 0 15px theme('colors.primary-fixed');
            border-radius: 4px;
        }

        .apple {
            background-color: theme('colors.accent-gold');
            box-shadow: 0 0 15px theme('colors.accent-gold');
            border-radius: 50%;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(34, 44, 40, 0.9) 0%, rgba(24, 34, 30, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid theme('colors.glass-border');
        }

        .d-pad-btn {
            background: theme('colors.surface-container-high');
            border: 1px solid theme('colors.glass-border');
            transition: all 0.2s ease;
        }
        .d-pad-btn:active {
            background: theme('colors.surface-container-highest');
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex font-body-md text-body-md">
<!-- Main App Area (Mocked as blurred background) -->
<main class="flex-1 relative hidden md:block">
<div class="absolute inset-0 bg-surface flex flex-col items-center justify-center">
<div class="w-full max-w-4xl px-margin-desktop opacity-30 pointer-events-none">
<div class="h-64 w-full bg-surface-container rounded-xl border border-glass-border mb-8"></div>
<div class="h-32 w-full bg-surface-container rounded-xl border border-glass-border"></div>
</div>
<!-- Transfer Status Override for Zen Mode Focus -->
<div class="absolute top-margin-desktop left-margin-desktop flex items-center gap-4 bg-surface-container-high/80 backdrop-blur-md border border-glass-border rounded-full py-2 px-6">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="font-label-mono text-label-mono text-on-surface">Transfer: 72% · 00:42 remaining</span>
</div>
</div>
<!-- Glow Effect behind side nav -->
<div class="absolute right-80 top-0 bottom-0 w-32 bg-primary/5 blur-3xl"></div>
</main>
<!-- SideNavBar (Flux Zen Panel - Active State) -->
<!-- Applying style_component_shape: fixed right-0 top-0 h-full w-80 (md:w-96 for better game fit) -->
<!-- Applying style_bg_color: bg-surface-container-high/90 backdrop-blur-2xl -->
<!-- Applying style_separation_logic: border-l border-glass-border -->
<!-- Applying style_shadows_and_elevation: shadow-2xl shadow-primary/5 -->
<!-- Applying style_shell_layout: flex flex-col h-full p-stack-md -->
<aside class="glass-panel w-full md:w-[450px] h-full flex flex-col shadow-2xl shadow-primary/5 relative z-50">
<!-- Header -->
<div class="flex items-center justify-between p-stack-md border-b border-glass-border">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-label-caps text-label-caps">Flux Zen</span>
</button>
<div class="flex gap-3">
<button class="p-2 rounded-lg bg-surface-container hover:bg-surface-container-highest transition-colors border border-glass-border text-on-surface">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="p-2 rounded-lg bg-surface-container hover:bg-error-container hover:text-on-error transition-colors border border-glass-border text-on-surface-variant">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
</div>
<!-- Mobile Transfer Status (Visible only on mobile) -->
<div class="md:hidden flex items-center justify-center gap-3 py-3 border-b border-glass-border bg-surface-container-lowest">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="font-label-mono text-label-mono text-on-surface-variant text-xs">Transfer: 72% · 00:42 remaining</span>
</div>
<!-- Game Content Area -->
<div class="flex-1 flex flex-col p-stack-md overflow-y-auto items-center">
<!-- Game Title & Score -->
<div class="w-full flex justify-between items-end mb-stack-lg mt-4">
<div>
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Snake Classic</h2>
<p class="font-label-mono text-label-mono text-on-surface-variant mt-1">Level 4</p>
</div>
<div class="text-right">
<div class="font-display-lg-mobile text-display-lg-mobile text-on-surface leading-none">1,240</div>
<div class="font-label-caps text-label-caps text-accent-gold mt-2">High Score: 4,500</div>
</div>
</div>
<!-- Game Canvas Container -->
<div class="w-full max-w-[400px] aspect-square relative flex-shrink-0">
<!-- Static CSS Game Grid Representation -->
<div class="game-grid w-full h-full absolute inset-0">
<!-- Generating empty cells via JS for cleanliness, but showing a few styled cells to meet requirements -->
<script>
                        for(let i=0; i<400; i++) {
                            document.write('<div class="game-cell"></div>');
                        }
                    </script>
</div>
<!-- Overlaying absolute elements to simulate game state -->
<div class="absolute inset-0 pointer-events-none grid grid-cols-20 grid-rows-20 gap-[1px]" style="grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(20, 1fr);">
<!-- Snake Body -->
<div class="snake-body" style="grid-column: 5; grid-row: 10;"></div>
<div class="snake-body" style="grid-column: 6; grid-row: 10;"></div>
<div class="snake-body" style="grid-column: 7; grid-row: 10;"></div>
<div class="snake-body" style="grid-column: 7; grid-row: 9;"></div>
<div class="snake-body" style="grid-column: 7; grid-row: 8;"></div>
<div class="snake-body" style="grid-column: 8; grid-row: 8;"></div>
<div class="snake-body" style="grid-column: 9; grid-row: 8;"></div>
<!-- Snake Head -->
<div class="snake-head flex items-center justify-center" style="grid-column: 10; grid-row: 8;">
<div class="w-1 h-1 bg-surface-container-lowest rounded-full mr-1"></div>
<div class="w-1 h-1 bg-surface-container-lowest rounded-full"></div>
</div>
<!-- Apple -->
<div class="apple" style="grid-column: 15; grid-row: 5; transform: scale(0.8);"></div>
</div>
<!-- Pause Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface-container-lowest/60 backdrop-blur-sm flex items-center justify-center rounded-lg hidden">
<span class="font-headline-md text-headline-md text-on-surface tracking-widest uppercase">Paused</span>
</div>
</div>
<!-- Touch Controls (D-Pad) -->
<div class="mt-auto pt-stack-lg pb-stack-md w-full flex justify-center">
<div class="grid grid-cols-3 grid-rows-3 gap-2 w-48 h-48 opacity-80 hover:opacity-100 transition-opacity">
<!-- Top Row -->
<div></div>
<button class="d-pad-btn rounded-t-xl rounded-b-md flex items-center justify-center text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-3xl">keyboard_arrow_up</span>
</button>
<div></div>
<!-- Middle Row -->
<button class="d-pad-btn rounded-l-xl rounded-r-md flex items-center justify-center text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-3xl">keyboard_arrow_left</span>
</button>
<div class="bg-surface-container-lowest rounded-md flex items-center justify-center border border-glass-border">
<div class="w-3 h-3 rounded-full bg-primary/20"></div>
</div>
<button class="d-pad-btn rounded-r-xl rounded-l-md flex items-center justify-center text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-3xl">keyboard_arrow_right</span>
</button>
<!-- Bottom Row -->
<div></div>
<button class="d-pad-btn rounded-b-xl rounded-t-md flex items-center justify-center text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-3xl">keyboard_arrow_down</span>
</button>
<div></div>
</div>
</div>
</div>
</aside>
</body></html>
