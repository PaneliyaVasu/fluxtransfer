<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FluxTransfer Mobile - Flux Zen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#bbcabf",
                        "inverse-primary": "#006c49",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#005236",
                        "surface": "#0c1512",
                        "text-warm": "#EDEAE2",
                        "secondary-fixed": "#b3eee5",
                        "tertiary-fixed": "#ffdad7",
                        "error": "#ffb4ab",
                        "primary-container": "#10b981",
                        "surface-container": "#18221e",
                        "on-error": "#690005",
                        "surface-container-lowest": "#07100d",
                        "on-secondary-container": "#8ac3bb",
                        "surface-bright": "#323b37",
                        "accent-gold": "#E8A33D",
                        "on-background": "#dae5df",
                        "tertiary": "#ffb3af",
                        "on-secondary-fixed-variant": "#0f4f49",
                        "background": "#0c1512",
                        "surface-container-low": "#141d1a",
                        "on-surface": "#dae5df",
                        "secondary": "#97d2c9",
                        "on-tertiary-fixed-variant": "#842225",
                        "tertiary-container": "#fc7c78",
                        "glass-border": "rgba(255, 255, 255, 0.08)",
                        "surface-container-high": "#222c28",
                        "surface-dim": "#0c1512",
                        "surface-container-highest": "#2d3733",
                        "inverse-surface": "#dae5df",
                        "error-container": "#93000a",
                        "surface-tint": "#4edea3",
                        "primary": "#4edea3",
                        "primary-fixed-dim": "#4edea3",
                        "primary-fixed": "#6ffbbe",
                        "on-primary-fixed": "#002113",
                        "inverse-on-surface": "#29322f",
                        "on-tertiary": "#650911",
                        "outline-variant": "#3c4a42",
                        "outline": "#86948a",
                        "on-secondary": "#003732",
                        "on-tertiary-container": "#711419",
                        "surface-variant": "#2d3733",
                        "on-primary-container": "#00422b",
                        "on-tertiary-fixed": "#410005",
                        "secondary-container": "#13524b",
                        "tertiary-fixed-dim": "#ffb3af",
                        "secondary-fixed-dim": "#97d2c9",
                        "on-secondary-fixed": "#00201d",
                        "on-primary": "#003824",
                        "surface-card": "#16211C"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "base": "4px",
                        "stack-sm": "8px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "label-mono": ["JetBrains Mono"],
                        "display-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .gradient-card {
            background: linear-gradient(180deg, rgba(22, 33, 28, 0.8) 0%, rgba(22, 33, 28, 0.4) 100%);
        }
        .glass-panel {
            background: rgba(34, 44, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface h-screen w-full overflow-hidden relative font-body-md text-body-md flex flex-col items-center justify-center">
<!-- Background Context (Transfer in Progress) -->
<div class="absolute inset-0 z-0 flex flex-col items-center justify-center opacity-30">
<div class="relative w-48 h-48 mb-8">
<svg class="w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-container-high" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="2"></circle>
<circle class="text-primary" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="100" stroke-linecap="round" stroke-width="2"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center font-display-lg-mobile text-display-lg-mobile text-primary">64%</div>
</div>
<p class="font-headline-md text-headline-md text-on-surface-variant">Transferring assets...</p>
</div>
<!-- Scrim -->
<div class="absolute inset-0 bg-surface/50 backdrop-blur-sm z-40"></div>
<!-- Flux Zen Bottom Sheet -->
<div class="rounded-t-xl h-[85vh] fixed bottom-0 left-0 right-0 z-[60] bg-surface-container-high dark:bg-surface-container-highest bg-surface-container-high backdrop-blur-md border-t border-glass-border shadow-lg flex flex-col w-full p-stack-lg max-w-2xl mx-auto">
<!-- Drag Handle -->
<div class="w-12 h-1 bg-outline-variant rounded-full mx-auto mb-6"></div>
<!-- Header -->
<div class="flex items-center gap-stack-sm mb-6">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h2 class="font-headline-md text-headline-md text-primary dark:text-primary">Flux Zen - While you wait</h2>
</div>
<!-- Tabs -->
<div class="flex gap-stack-sm mb-8 border-b border-glass-border pb-2">
<button class="px-4 py-2 font-label-caps text-label-caps text-primary border-b-2 border-primary">Play</button>
<button class="px-4 py-2 font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Discover</button>
<button class="px-4 py-2 font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Zen</button>
</div>
<!-- Content Area: Play Tab Active -->
<div class="flex-1 overflow-y-auto pr-2 space-y-4">
<!-- Game Card 1 -->
<div class="gradient-card border border-glass-border rounded-lg p-4 flex items-center gap-4 hover:border-primary/50 transition-colors group">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-glass-border">
<span class="material-symbols-outlined text-primary text-2xl">gesture</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold mb-1">Neon Snake</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Classic snake with a cyber twist. Survive the longest.</p>
</div>
<button class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-4 py-2 rounded hover:brightness-110 active:scale-95 transition-all">Play</button>
</div>
<!-- Game Card 2 -->
<div class="gradient-card border border-glass-border rounded-lg p-4 flex items-center gap-4 hover:border-primary/50 transition-colors group">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-glass-border">
<span class="material-symbols-outlined text-accent-gold text-2xl">view_cozy</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold mb-1">Memory Match</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Test your recall. Match identical cryptographic nodes.</p>
</div>
<button class="bg-surface-bright text-on-surface font-label-caps text-label-caps px-4 py-2 rounded border border-glass-border hover:bg-surface-variant active:scale-95 transition-all">Play</button>
</div>
<!-- Game Card 3 -->
<div class="gradient-card border border-glass-border rounded-lg p-4 flex items-center gap-4 hover:border-primary/50 transition-colors group">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-glass-border">
<span class="material-symbols-outlined text-tertiary text-2xl">grid_on</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold mb-1">Grid Sweeper</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Clear the grid without hitting the anomalies.</p>
</div>
<button class="bg-surface-bright text-on-surface font-label-caps text-label-caps px-4 py-2 rounded border border-glass-border hover:bg-surface-variant active:scale-95 transition-all">Play</button>
</div>
</div>
</div>
</body></html>
