<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Left Green Card -->
  <rect x="20" y="25" width="45" height="70" rx="10" fill="url(#greenGrad)"/>
  <!-- Right Blue/Cyan Card -->
  <rect x="75" y="25" width="45" height="70" rx="10" fill="url(#cyanGrad)"/>
  
  <!-- Up Arrow on Left Card -->
  <path d="M 42.5 70 L 42.5 45 M 35 52 L 42.5 44 L 50 52" stroke="#07100D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Down Arrow on Right Card -->
  <path d="M 97.5 50 L 97.5 75 M 90 68 L 97.5 76 L 105 68" stroke="#07100D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top Curved Arrow -->
  <path d="M 42 20 C 55 5, 85 5, 98 20" stroke="#10B981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 92 14 L 100 20 L 94 28" fill="#10B981"/>

  <!-- Bottom Curved Arrow -->
  <path d="M 98 100 C 85 115, 55 115, 42 100" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 48 106 L 40 100 L 46 92" fill="#06B6D4"/>

  <!-- Brand Text -->
  <text x="140" y="74" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="42" fill="#FFFFFF" letter-spacing="-0.02em">Flux<tspan fill="#4EDEA3">Transfer</tspan></text>

  <defs>
    <linearGradient id="greenGrad" x1="20" y1="25" x2="65" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EDEA3"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="75" y1="25" x2="120" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
</svg>
