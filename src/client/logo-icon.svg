<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" fill="none">
  <!-- Left Green Card -->
  <rect x="15" y="25" width="45" height="70" rx="10" fill="url(#greenGrad)"/>
  <!-- Right Blue/Cyan Card -->
  <rect x="70" y="25" width="45" height="70" rx="10" fill="url(#cyanGrad)"/>
  
  <!-- Up Arrow on Left Card -->
  <path d="M 37.5 70 L 37.5 45 M 30 52 L 37.5 44 L 45 52" stroke="#07100D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Down Arrow on Right Card -->
  <path d="M 92.5 50 L 92.5 75 M 85 68 L 92.5 76 L 100 68" stroke="#07100D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top Curved Arrow -->
  <path d="M 37 20 C 50 5, 80 5, 93 20" stroke="#10B981" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 87 14 L 95 20 L 89 28" fill="#10B981"/>

  <!-- Bottom Curved Arrow -->
  <path d="M 93 100 C 80 115, 50 115, 37 100" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 43 106 L 35 100 L 41 92" fill="#06B6D4"/>

  <defs>
    <linearGradient id="greenGrad" x1="15" y1="25" x2="60" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EDEA3"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="70" y1="25" x2="115" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
</svg>
