<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux Zen Test Suite</title>
  <style>
    :root {
      --bg: #0D1512;
      --panel: #16211C;
      --line: #24332B;
      --text: #EDEAE2;
      --text-muted: #8A9691;
      --sage: #6FA8A0;
      --error: #D9695F;
      --amber: #E8A33D;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      color: var(--sage);
    }

    .stats {
      display: flex;
      gap: 20px;
      background: var(--panel);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
    }

    .stat-item {
      font-family: monospace;
      font-size: 14px;
    }

    .pass-count {
      color: var(--sage);
      font-weight: bold;
    }

    .fail-count {
      color: var(--error);
      font-weight: bold;
    }

    .test-section {
      margin-top: 30px;
    }

    .test-section-title {
      font-size: 18px;
      color: var(--amber);
      margin-bottom: 10px;
    }

    .test-case {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .test-case.passed {
      border-left: 4px solid var(--sage);
    }

    .test-case.failed {
      border-left: 4px solid var(--error);
      background: rgba(217, 105, 95, 0.05);
    }

    .test-name {
      font-family: monospace;
    }

    .test-status {
      font-weight: bold;
      text-transform: uppercase;
      font-size: 11px;
    }

    .test-status.passed {
      color: var(--sage);
    }

    .test-status.failed {
      color: var(--error);
    }

    /* Mock components stylings to keep testing UI visible but off-site if needed */
    #mock-dom-elements {
      border: 1px dashed var(--line);
      padding: 15px;
      border-radius: 8px;
      margin-top: 30px;
      background: rgba(22, 33, 28, 0.2);
    }

    #mock-dom-elements h3 {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 10px;
    }
  </style>

  <!-- Load target modules under test -->
  <link rel="stylesheet" href="zen.css">
  <script src="facts.js"></script>
  <script src="games.js"></script>
  <script src="visuals.js"></script>
  <script src="zen.js"></script>
</head>

<body>

  <h1>Flux Zen Automated Test Suite</h1>

  <div class="stats">
    <div class="stat-item">Tests Run: <span id="total-run">0</span></div>
    <div class="stat-item">Passed: <span id="total-passed" class="pass-count">0</span></div>
    <div class="stat-item">Failed: <span id="total-failed" class="fail-count">0</span></div>
  </div>

  <div id="test-results"></div>

  <!-- DOM Mock Area required for FluxZen DOM access -->
  <div id="mock-dom-elements">
    <h3>Mock Workspace DOM Structure</h3>

    <div class="wrap">
      <div class="content-area">
        <!-- Send panel mocks -->
        <div id="sendPanel">
          <div id="sendProgressWrap" class="hidden">Mock Sender Progress Content</div>
        </div>

        <!-- Receive panel mocks -->
        <div id="receivePanel" class="hidden">
          <div id="recvProgressWrap" class="hidden">Mock Receiver Progress Content</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simple micro testing framework
    let runCount = 0;
    let passedCount = 0;
    let failedCount = 0;
    let currentSection = null;

    function section(name) {
      const resultsDiv = document.getElementById('test-results');
      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'test-section';
      sectionDiv.innerHTML = `<div class="test-section-title">${name}</div>`;
      resultsDiv.appendChild(sectionDiv);
      currentSection = sectionDiv;
    }

    function assert(condition, name, details = '') {
      runCount++;
      const success = !!condition;
      if (success) passedCount++;
      else failedCount++;

      // Update header counters
      document.getElementById('total-run').textContent = runCount;
      document.getElementById('total-passed').textContent = passedCount;
      document.getElementById('total-failed').textContent = failedCount;

      const caseDiv = document.createElement('div');
      caseDiv.className = `test-case ${success ? 'passed' : 'failed'}`;
      caseDiv.innerHTML = `
        <span class="test-name">${name} ${details ? '<span style="color:var(--text-muted)">(' + details + ')</span>' : ''}</span>
        <span class="test-status ${success ? 'passed' : 'failed'}">${success ? 'Pass' : 'Fail'}</span>
      `;
      currentSection.appendChild(caseDiv);
    }

    // Run tests on page load
    window.addEventListener('load', () => {
      // 1. Setup mock DOM states
      const sendPanel = document.getElementById('sendPanel');
      const sendProgressWrap = document.getElementById('sendProgressWrap');
      const receivePanel = document.getElementById('receivePanel');
      const recvProgressWrap = document.getElementById('recvProgressWrap');

      // Helper to activate mocks
      const setSenderActive = () => {
        sendPanel.classList.remove('hidden');
        sendProgressWrap.classList.remove('hidden');
        receivePanel.classList.add('hidden');
        recvProgressWrap.classList.add('hidden');
      };

      // --- SECTION: PERMANENT SPLIT LAYOUT & ALWAYS-VISIBLE PANEL ---
      section('Permanent Split Layout & Always-Visible Games');

      setSenderActive();
      FluxZen.initDOM();
      FluxZen.render();

      let fullPanel = document.getElementById('zenFullPanel');
      assert(fullPanel !== null, 'Flux Zen panel is permanently visible on page load');

      // ETA update keeps full panel visible and updates ETA text
      FluxZen.updateProgress(35, { loaded: 10, total: 100, pct: 10, speedBps: 1 });
      fullPanel = document.getElementById('zenFullPanel');
      assert(fullPanel !== null, 'ETA progress updates keep games panel visible');

      // --- SECTION: GAME PLAY TOAST POPUP ---
      section('Game Play Toast Popup & Post-Transfer Play');

      // 1. Game play toast popup displays on transfer start
      let gameplayToast = document.getElementById('flux-zen-gameplay-popup');
      assert(gameplayToast !== null, 'Game play toast popup is displayed on transfer start');

      // 2. Dismissing toast removes popup without closing games panel
      const closeToastBtn = document.getElementById('zenGameplayCloseBtn');
      if (closeToastBtn) closeToastBtn.click();
      gameplayToast = document.getElementById('flux-zen-gameplay-popup');
      assert(gameplayToast === null || gameplayToast.classList.contains('closing'), 'Game play toast popup is removed after clicking dismiss');

      // 3. onTransferComplete does not close the games panel
      FluxZen.onTransferComplete();
      fullPanel = document.getElementById('zenFullPanel');
      assert(fullPanel !== null, 'Full panel remains open after onTransferComplete');

      const subtitle = document.getElementById('zenSubtitle');
      assert(subtitle !== null && subtitle.textContent.includes('Transfer complete!'), 'Subtitle text changes to complete message');

      // --- SECTION: DISCOVER TRIVIA ---
      section('Discover Mode & Favorites Persistence');

      assert(FluxZenFacts !== undefined, 'Facts provider loaded');
      const allFacts = FluxZenFacts.getAll();
      assert(allFacts.length >= 30, 'Contains 30 or more static trivia facts', `Count: ${allFacts.length}`);

      const categories = FluxZenFacts.getCategories();
      assert(categories.includes('Technology') && categories.includes('Space') && categories.includes('Programming'), 'Covers tech, space, and coding categories');

      const randomFact = FluxZenFacts.getRandom();
      assert(randomFact && randomFact.text && randomFact.category, 'Can load a valid random fact');

      // Next fact loop
      const nextFact = FluxZenFacts.getNext(randomFact.id);
      assert(nextFact && nextFact.id !== randomFact.id, 'Next fact navigation returns a new fact item');

      // Favorites localStorage test
      const testFactId = 12;
      localStorage.removeItem('flux_zen_favorite_facts');

      // Favorite
      let isFav = FluxZenFacts.toggleFavorite(testFactId);
      assert(isFav === true, 'Fact favorited');
      assert(FluxZenFacts.isFavorite(testFactId) === true, 'isFavorite confirms state');
      assert(FluxZenFacts.getFavoritesCount() === 1, 'Favorites count matches');

      // Unfavorite
      isFav = FluxZenFacts.toggleFavorite(testFactId);
      assert(isFav === false, 'Fact unfavorited');
      assert(FluxZenFacts.isFavorite(testFactId) === false, 'isFavorite confirms toggle out');
      assert(FluxZenFacts.getFavoritesCount() === 0, 'Favorites count goes back to 0');

      // --- SECTION: ZEN AND REDUCED MOTION ---
      section('Zen Relaxation & Reduced Motion');

      assert(FluxZenVisuals !== undefined, 'Visuals module loaded');

      // Instantiate Breathing
      const mockWrap = document.createElement('div');
      const mockPrompt = document.createElement('div');
      const breathing = new FluxZenVisuals.BreathingGuide(mockWrap, mockPrompt);

      breathing.start();
      assert(mockPrompt.textContent !== '', 'Breathing guide outputs text prompt');

      // Reduced motion test simulation
      mockWrap.className = '';
      mockWrap.classList.add('reduced-motion');
      assert(mockWrap.classList.contains('reduced-motion'), 'Reduced motion class successfully applied to visual container');

      breathing.stop();
      assert(mockPrompt.textContent === '', 'Breathing guide stop clears text prompts');

      // --- SECTION: MINI GAMES ---
      section('Play Mode Games');

      assert(FluxZenGames !== undefined, 'Games module loaded');
      assert(typeof FluxZenGames.SnakeGame === 'function', 'SnakeGame class exists');
      assert(typeof FluxZenGames.MemoryMatchGame === 'function', 'MemoryMatchGame class exists');

      // Test Snake Init
      const mockCanvas = document.createElement('canvas');
      mockCanvas.width = 240;
      mockCanvas.height = 240;
      const snake = new FluxZenGames.SnakeGame(mockCanvas);
      snake.init();
      assert(snake.running === true, 'SnakeGame starts successfully');
      assert(snake.snake.length === 3, 'Snake starts with size 3');
      snake.stop();
      assert(snake.running === false, 'SnakeGame stops successfully');

      // Test Memory Match Card Generation
      const mockGrid = document.createElement('div');
      const memory = new FluxZenGames.MemoryMatchGame(mockGrid);
      memory.init();
      const cardElements = mockGrid.querySelectorAll('.zen-memory-card');
      assert(cardElements.length === 16, 'Memory game renders exactly 16 card grids (8 pairs)');
      memory.stop();
      assert(mockGrid.innerHTML === '', 'Memory game stop clears elements');

      // --- SECTION: MULTIPLAYER & EXPANDED GAMES ---
      section('Multiplayer & Expanded Games');

      assert(typeof FluxZenGames.TicTacToeGame === 'function', 'TicTacToeGame class exists');
      assert(typeof FluxZenGames.ConnectFourGame === 'function', 'ConnectFourGame class exists');
      assert(typeof FluxZenGames.PongGame === 'function', 'PongGame class exists');
      assert(typeof FluxZenGames.RPSGame === 'function', 'RPSGame class exists');
      assert(typeof FluxZenGames.MinesweeperGame === 'function', 'MinesweeperGame class exists');

      // 1. Minesweeper test
      const mockMSGrid = document.createElement('div');
      const msGame = new FluxZenGames.MinesweeperGame(mockMSGrid);
      msGame.init();
      assert(msGame.running === true, 'Minesweeper starts in running state');
      let mineCount = 0;
      msGame.grid.forEach(r => r.forEach(c => { if (c.isMine) mineCount++; }));
      assert(mineCount === 10, 'Minesweeper places exactly 10 mines');
      msGame.stop();
      assert(mockMSGrid.innerHTML === '', 'Minesweeper stop clears elements');

      // 2. Tic Tac Toe P2P Move sync test
      const tttArea1 = document.createElement('div');
      const tttArea2 = document.createElement('div');
      let lastSentMsg = null;
      const ttt1 = new FluxZenGames.TicTacToeGame(tttArea1, { sendMsg: (msg) => { lastSentMsg = msg; } });
      const ttt2 = new FluxZenGames.TicTacToeGame(tttArea2, {});
      ttt1.init('peer', 'X');
      ttt2.init('peer', 'O');

      assert(ttt1.isMyTurn() === true, 'Player X (host) starts as their turn');
      assert(ttt2.isMyTurn() === false, 'Player O (guest) waits for host');

      ttt1.handleCellClick(4);
      assert(ttt1.board[4] === 'X', 'Host move marks cell 4');
      assert(lastSentMsg !== null && lastSentMsg.action === 'move' && lastSentMsg.data.cellIndex === 4, 'Host move dispatches move packet to peer');

      ttt2.receiveMove(lastSentMsg.data);
      assert(ttt2.board[4] === 'X', 'Guest receives and applies peer move');
      assert(ttt2.isMyTurn() === true, 'Guest turn is now active');
      ttt1.stop();
      ttt2.stop();

      // 3. Connect Four disc drop test
      const c4Area = document.createElement('div');
      const c4 = new FluxZenGames.ConnectFourGame(c4Area, {});
      c4.init('local');
      c4.handleColSelect(3);
      assert(c4.board[5][3] === 'R', 'Connect Four piece falls to the bottom of the column');
      c4.stop();

      // Final report
      console.log(`Test complete. Passed: ${passedCount}, Failed: ${failedCount}`);
    });
  </script>
</body>

</html>
